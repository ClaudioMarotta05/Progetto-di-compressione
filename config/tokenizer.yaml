# config/tokenizer.yaml — Fase 0
# Definizione congelata di "parola" per il progetto.
# Una parola è una sequenza massimale di caratteri che soddisfa word_pattern.
# I token non-parola (punteggiatura, spazi, simboli) non sono mai candidati
# all'elisione.

word_pattern: "[A-Za-zÀ-ÖØ-öø-ÿ0-9_]+"
non_word_never_elided: true
